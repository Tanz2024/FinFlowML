services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finflowml}
      POSTGRES_USER: ${POSTGRES_USER:-finflowml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private]

  migrations:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finflowml}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finflowml}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-mock}
      UPLOAD_ROOT: /data/uploads
      FINFLOW_MOCK_EXTRACTION: ${FINFLOW_MOCK_EXTRACTION:-true}
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on: {db: {condition: service_healthy}}
    volumes: [receipt_uploads:/data/uploads]
    networks: [private]
    restart: "no"

  api:
    build: .
    environment: *app-env
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - target: 8000
        published: ${API_PORT:-8000}
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    depends_on: {migrations: {condition: service_completed_successfully}}
    volumes: [receipt_uploads:/data/uploads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private, edge]
    deploy: {resources: {limits: {cpus: "2.0", memory: 1G}}}

  frontend:
    build: ./frontend
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://api:8000
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      NODE_ENV: production
    ports:
      - target: 3000
        published: ${FRONTEND_PORT:-3000}
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private, edge]
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}

  worker:
    profiles: [mock]
    build: .
    environment: *app-env
    command: ["python", "-m", "backend.worker"]
    depends_on: {migrations: {condition: service_completed_successfully}}
    volumes: [receipt_uploads:/data/uploads]
    restart: unless-stopped
    networks: [private]
    deploy: {resources: {limits: {cpus: "2.0", memory: 2G}}}

volumes:
  postgres_data:
  receipt_uploads:
networks:
  private: {internal: true}
  edge: {}
