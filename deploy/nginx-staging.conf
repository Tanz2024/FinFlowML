server {
    listen 443 ssl http2;
    server_name staging.example.internal;
    ssl_certificate /etc/letsencrypt/live/staging.example.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.internal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
server { listen 80; server_name staging.example.internal; return 301 https://$host$request_uri; }
