name: CPU regression

on:
  push:
  pull_request:

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      FINFLOW_MOCK_EXTRACTION: "true"
      AUTH_SECRET: test-only-secret-that-is-long-enough-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements.txt
          # Keep the repository's pinned resolver set intact; torch 2.6.0's
          # stricter sympy pin is irrelevant to these mocked CPU tests.
          python -m pip install --no-deps torch==2.6.0
      - name: Run backend and ML tests
        run: python -m pytest -q backend/tests ml/tests
      - name: Run Ruff
        run: ruff check backend ml scripts
