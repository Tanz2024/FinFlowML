name: CPU regression

on:
  push:
  pull_request:

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      FINFLOW_MOCK_EXTRACTION: "true"
      AUTH_SECRET: test-only-secret-that-is-long-enough-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements.txt
          # Resolve a CPU wheel from the official PyTorch index, including its
          # runtime dependencies. Do not install a CUDA wheel or use --no-deps.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple torch
      - name: Run pytest
        run: python -m pytest -q backend/tests ml/tests
      - name: Run Ruff
        run: python -m ruff check backend ml scripts
