name: CPU regression

on:
  push:
  pull_request:

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finflowml
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: finflowml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finflowml -d finflowml_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ENVIRONMENT: test
      AUTH_SECRET: test-only-secret-that-is-long-enough-123456
      FINFLOW_POSTGRES_TEST_URL: postgresql+psycopg://finflowml:ci-only-password@localhost:5432/finflowml_test
      DATABASE_URL: postgresql+psycopg://finflowml:ci-only-password@localhost:5432/finflowml_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements.txt
          # Resolve a CPU wheel from the official PyTorch index, including its
          # runtime dependencies. Do not install a CUDA wheel or use --no-deps.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple torch
      - name: Run pytest
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m pytest -q backend/tests ml/tests
      - name: Run Ruff
        run: python -m ruff check backend ml scripts
